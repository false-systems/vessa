[package]
name = "vessa"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local agent usage and spending evidence"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse provider RFC3339 timestamps and date-specific rate cards correctly.
chrono = { version = "0.4", default-features = false, features = ["std"] }
