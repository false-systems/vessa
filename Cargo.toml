[package]
name = "vessa"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Local agent token usage and conversation evidence"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse transcript timestamps and UTC calendar periods correctly.
chrono = { version = "0.4", default-features = false, features = ["std"] }
