[package]
name = "vessa"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
# Removed when the owner decides to publish; the rest of the metadata is in place.
publish = false
license = "MIT"
description = "Local agent token usage and conversation evidence"
repository = "https://github.com/false-systems/vessa"
readme = "README.md"
keywords = ["agents", "tokens", "usage", "transcripts", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The package is the source, the README and the licence: no tests, fixtures,
# CI files or agent guides.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse transcript timestamps and UTC calendar periods correctly.
chrono = { version = "0.4", default-features = false, features = ["std"] }
