name: Release

on:
  push:
    tags:
      - "v*"
  # By hand on a branch: everything but the release itself, as a dry run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Before any hosted minute is spent: the tag names the crate's version.
  # It runs on the organisation's own runner.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep aligned with rust-toolchain.toml.
          toolchain: "1.98"
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package=$(cargo pkgid -p vessa)
          version=${package##*#}
          version=${version##*@}
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2; exit 1; }

  # One archive per platform, on GitHub's hosted runners: the binary, the
  # licence and the README. Linux binaries are static (musl); Windows is a zip.
  build:
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: x86_64
            file_match: x86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: aarch64
            file_match: ARM aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            file_match: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
            file_match: arm64
          # Windows on ARM hosted runners are public-repository only; x86_64
          # covers Windows until that changes.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            file_match: PE32+
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential file musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep aligned with rust-toolchain.toml.
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify and package
        run: |
          set -euo pipefail
          # A run by hand from a branch whose name holds a slash still makes a
          # valid file name.
          ref=${GITHUB_REF_NAME//\//-}
          name="vessa-${ref}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir package
          cp LICENSE README.md package/
          if [ "${{ matrix.platform }}" = windows ]; then
            binary="target/${{ matrix.target }}/release/vessa.exe"
            "$binary" --help >/dev/null
            # Git for Windows' file(1) reads PE headers; the archive is a zip
            # holding vessa.exe at its root, like the tarballs hold vessa.
            file "$binary" | grep -q "${{ matrix.file_match }}"
            cp "$binary" package/
            (cd package && 7z a -tzip "$GITHUB_WORKSPACE/$name.zip" vessa.exe LICENSE README.md >/dev/null)
          else
            binary="target/${{ matrix.target }}/release/vessa"
            info=$(file "$binary")
            echo "$info"
            grep -q "${{ matrix.file_match }}" <<<"$info"
            if [ "${{ matrix.platform }}" = linux ]; then
              # x86_64 musl builds are static-pie; file(1) words that apart.
              grep -q -E "statically linked|static-pie linked" <<<"$info"
            fi
            "$binary" --help >/dev/null
            cp "$binary" package/
            tar -czf "$name.tar.gz" -C package vessa LICENSE README.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: vessa-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            vessa-*.tar.gz
            vessa-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: vessa-*
          merge-multiple: true
      - run: sha256sum vessa-*.tar.gz vessa-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            vessa-*.tar.gz
            vessa-*.zip
            SHA256SUMS
