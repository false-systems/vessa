name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: target
      CARGO_BUILD_BUILD_DIR: target/build
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Keep aligned with rust-toolchain.toml; patch updates still float.
          toolchain: "1.98"
          components: clippy, rustfmt

      # The opencode tests make and read SQLite stores with the sqlite3
      # command, as Vessa reads opencode's store.
      - name: Ensure sqlite3
        run: |
          if command -v sqlite3 >/dev/null 2>&1; then
            sqlite3 --version
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::runner has no sqlite3 and no apt-get to install it"
            exit 1
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::runner has no sqlite3 and needs sudo or root to install it"
              exit 1
            fi
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install -y --no-install-recommends sqlite3
          sqlite3 --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Exercise the binary on synthetic fixtures
        run: >-
          cargo run --locked -- usage
          --input examples/claude.jsonl
          --input examples/codex.jsonl
          --input examples/pi.jsonl
          --json

  # vessa is released for Windows too, so its tests run there. This job uses a
  # GitHub-hosted runner; while the repository is private those minutes are billed.
  windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"

      # The opencode tests make and read SQLite stores with the sqlite3
      # command, as vessa reads opencode's store.
      - name: Install sqlite3
        run: |
          choco install sqlite --no-progress -y
          sqlite3 --version

      - name: Test
        run: cargo test --locked --no-fail-fast
